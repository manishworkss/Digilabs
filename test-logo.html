<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #020205; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .logo { width: 200px; height: 200px; color: white; }
  </style>
</head>
<body>
  <svg viewBox="0 0 100 100" fill="currentColor" class="logo">
    <defs>
      <clipPath id="inner-circle">
        <circle cx="50" cy="50" r="38" />
      </clipPath>
    </defs>
    <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="8" fill="none" />
    <g clip-path="url(#inner-circle)">
      <!-- Left Stem -->
      <polygon points="25,100 39,100 39,46.6 25,7.85" />
      <!-- Right Stem -->
      <polygon points="61,0 75,0 75,91.45 61,52.67" />
      <!-- Diagonal -->
      <polygon points="25,0 39,0 75,100 61,100" />
    </g>
  </svg>
</body>
</html>
